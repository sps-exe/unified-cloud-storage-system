name: UCSS CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Build, Lint & Automated Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ucss_user
          POSTGRES_PASSWORD: ucss_dev_password_change_in_prod
          POSTGRES_DB: ucss_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: 🟢 Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: 🐍 Setup Python (v3.11)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔐 Configure test environment
        run: |
          cp .env.example .env
          cp .env.example apps/api/.env
          cp .env.example packages/database/.env
          # Inject deterministic 64-char hex keys for testing
          sed -i 's/REPLACE_WITH_64_BYTE_HEX_STRING_MIN_32_CHARS/0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef/g' .env apps/api/.env
          sed -i 's/REPLACE_WITH_DIFFERENT_64_BYTE_HEX_STRING/fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210/g' .env apps/api/.env
          sed -i 's/REPLACE_WITH_EXACTLY_64_HEX_CHARS/abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789/g' .env apps/api/.env

      - name: 🗄️ Run Prisma migrations
        run: pnpm --filter @ucss/database prisma migrate deploy

      - name: 🏗️ Typecheck & Build All Packages
        run: pnpm build

      - name: 🚀 Start API server for automated integration tests
        run: |
          pnpm --filter @ucss/api build
          node apps/api/dist/server.js &
          # Wait for health check
          for i in {1..30}; do
            curl -s http://localhost:4000/api/health && break || sleep 1
          done

      - name: 🧪 Execute Master Integration Test Suite (117+ Assertions)
        run: python3 scripts/run-all-tests.py
