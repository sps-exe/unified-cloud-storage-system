name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Typecheck, build and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ucss_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d ucss_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/ucss_ci
      JWT_ACCESS_SECRET: ci-access-secret-ci-access-secret-0123456789
      JWT_REFRESH_SECRET: ci-refresh-secret-ci-refresh-secret-0123456789
      TOKEN_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ucss/database exec prisma generate
      - run: pnpm --filter @ucss/database exec prisma migrate deploy
      - run: pnpm --filter @ucss/shared run build
      - run: pnpm --filter @ucss/database run build
      - run: pnpm --filter @ucss/api run lint
      - run: pnpm --filter @ucss/web run build
      - run: pnpm --filter @ucss/api run test

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ucss:ci .
