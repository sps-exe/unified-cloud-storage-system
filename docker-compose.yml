version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ucss_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ucss_user
      POSTGRES_PASSWORD: ucss_dev_password_change_in_prod
      POSTGRES_DB: ucss_db
    ports:
      - "5432:5432"
    volumes:
      - ucss_pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ucss_user -d ucss_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ucss_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ucss.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

volumes:
  ucss_pgdata:
    driver: local
